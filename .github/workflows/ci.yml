name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrogmao
          POSTGRES_USER: agrogmao
          POSTGRES_PASSWORD: agrogmao-ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agrogmao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci
      DJANGO_DEBUG: "false"
      POSTGRES_DB: agrogmao
      POSTGRES_USER: agrogmao
      POSTGRES_PASSWORD: agrogmao-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Descargar el código
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

        - name: Instalar dependencias
          run: pip install -r requirements-dev.txt

        - name: Comprobar la configuración de DJANGO_DEBUG
          run: python manage.py check

        - name: Ejecutar las pruebas con cobertura
          run: coverage run manage.py test

        - name: Informe de cobertura
          run: |
            coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
            coverage report