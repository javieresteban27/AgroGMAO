{% extends "base.html" %}
{% load i18n %}

{% block titulo %}{% translate "Entrar" %} · AgroGMAO{% endblock %}

{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <h1 class="h3 mb-3">{% translate "Entrar" %}</h1>
            <form method="post" novalidate>
                {% csrf_token %}
                {% if form.non_field_errors %}
                <div class="alert alert-danger" role="alert">
                    {% for error in form.non_field_errors %}{{ error }}{% endfor %}                    
                </div>
                {% endif %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">{% translate "Usuario" %}</label>
                    <input type="text" name="username" id="id_username" class="form-control form-control-lg" 
                        autocomplete="username" value="{{ form.username.value|default:'' }}" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">{% translate "Contraseña" %}</label>
                    <input type="password" name="password" id="id_password"
                        class="form-control form-control-lg" autocomplete="current-password" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary btn-lg w-100">{% translate "Entrar" %}</button>
            </form>
        </div>
    </div>
{% endblock %}
